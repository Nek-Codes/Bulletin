<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bulletin | Literary Club</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


<header class="navbar">

    <div class="nav-left">

        <a href="../index.html" class="brand-link">

            <img
                src="../Home/Club logo.png"
                class="nav-logo"
                alt="Literary Club Logo"
            >

            <span class="nav-brand">
                Literary Club
            </span>

        </a>

    </div>


    <nav class="nav-menu">

        <a href="../index.html">
            <strong>Home</strong>
        </a>

        <a href="../content/index.html">
            CONTENTS
        </a>

    </nav>

</header>



<main class="reader">


    <div class="page-container">

        <img
            id="bulletinPage"
            src=""
            alt="Bulletin Page"
        >

    </div>


    <div class="controls">


        <button
            id="previousButton"
            class="control-button"
            aria-label="Previous page"
        >
            ←
        </button>


        <div class="page-counter">

            <span id="currentPage">
                01
            </span>

            <span class="separator">
                /
            </span>

            <span id="totalPages">
                01
            </span>

        </div>


        <button
            id="nextButton"
            class="control-button"
            aria-label="Next page"
        >
            →
        </button>


    </div>


</main>



<script src="pages.js"></script>

<script>

let currentPageIndex = 0;


const bulletinPage =
    document.getElementById("bulletinPage");

const previousButton =
    document.getElementById("previousButton");

const nextButton =
    document.getElementById("nextButton");

const currentPage =
    document.getElementById("currentPage");

const totalPages =
    document.getElementById("totalPages");



function loadPage(
    index,
    direction = "next"
) {

    if (pages.length === 0) {
        return;
    }


    if (index < 0) {
        index = 0;
    }

    if (index >= pages.length) {
        index = pages.length - 1;
    }


    currentPageIndex = index;


    const exitClass =
        direction === "next"
            ? "page-exit-left"
            : "page-exit-right";


    const enterClass =
        direction === "next"
            ? "page-enter-right"
            : "page-enter-left";


    bulletinPage.classList.remove(
        "page-enter-left",
        "page-enter-right",
        "page-exit-left",
        "page-exit-right"
    );


    bulletinPage.classList.add(
        exitClass
    );


    setTimeout(() => {

        bulletinPage.src =
            "pages/" +
            pages[currentPageIndex];


        bulletinPage.classList.remove(
            exitClass
        );

        bulletinPage.classList.add(
            enterClass
        );


        void bulletinPage.offsetWidth;


        bulletinPage.classList.remove(
            enterClass
        );


    }, 180);


    const pageNumber =
        currentPageIndex + 1;


    currentPage.textContent =
        String(pageNumber)
            .padStart(2, "0");


    totalPages.textContent =
        String(pages.length)
            .padStart(2, "0");


    previousButton.disabled =
        currentPageIndex === 0;

    nextButton.disabled =
        currentPageIndex ===
        pages.length - 1;


    const newUrl =
        window.location.pathname +
        "?page=" +
        pageNumber;


    window.history.replaceState(
        {},
        "",
        newUrl
    );

}



function nextPage() {

    if (
        currentPageIndex <
        pages.length - 1
    ) {

        loadPage(
            currentPageIndex + 1,
            "next"
        );

    }

}



function previousPage() {

    if (
        currentPageIndex > 0
    ) {

        loadPage(
            currentPageIndex - 1,
            "previous"
        );

    }

}



nextButton.addEventListener(
    "click",
    nextPage
);


previousButton.addEventListener(
    "click",
    previousPage
);



document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "ArrowRight") {
            nextPage();
        }

        if (event.key === "ArrowLeft") {
            previousPage();
        }

    }
);



function getStartingPage() {

    const urlParams =
        new URLSearchParams(
            window.location.search
        );


    const page =
        parseInt(
            urlParams.get("page")
        );


    if (
        !isNaN(page) &&
        page >= 1 &&
        page <= pages.length
    ) {

        return page - 1;

    }


    return 0;

}



loadPage(
    getStartingPage()
);

</script>


</body>

</html>
