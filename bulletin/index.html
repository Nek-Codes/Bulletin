<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bulletin | Literary Club</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


<!-- =====================================================
     NAVIGATION
===================================================== -->

<header class="navbar">

    <div class="nav-left">

        <a href="../index.html" class="brand-link">

            <img
                src="../Home/Club logo.png"
                class="nav-logo"
                alt="Literary Club Logo"
            >

            <span class="nav-brand">
                Literary Club
            </span>

        </a>

    </div>


    <nav class="nav-menu">

        <a href="../index.html">
            <strong>Home</strong>
        </a>

        <a href="../content/index.html">
            CONTENTS
        </a>

    </nav>

</header>



<!-- =====================================================
     BULLETIN READER
===================================================== -->

<main class="reader">


    <!-- PAGE -->

    <div class="page-container">

        <img
            id="bulletinPage"
            src=""
            alt="Bulletin Page"
        >

    </div>


    <!-- CONTROLS -->

    <div class="controls">


        <button
            id="previousButton"
            class="control-button"
            aria-label="Previous page"
        >
            ←
        </button>


        <div class="page-counter">

            <span id="currentPage">
                01
            </span>

            <span class="separator">
                /
            </span>

            <span id="totalPages">
                01
            </span>

        </div>


        <button
            id="nextButton"
            class="control-button"
            aria-label="Next page"
        >
            →
        </button>


    </div>


</main>



<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script src="pages.js"></script>

<script>

let currentPageIndex = 0;


/* =========================================================
   ELEMENTS
========================================================= */

const bulletinPage =
    document.getElementById("bulletinPage");

const previousButton =
    document.getElementById("previousButton");

const nextButton =
    document.getElementById("nextButton");

const currentPage =
    document.getElementById("currentPage");

const totalPages =
    document.getElementById("totalPages");


/* =========================================================
   LOAD PAGE
========================================================= */

function loadPage(index) {

    if (pages.length === 0) {
        return;
    }


    /* Keep index within range */

    if (index < 0) {
        index = 0;
    }

    if (index >= pages.length) {
        index = pages.length - 1;
    }


    currentPageIndex = index;


    /* Load image */

    bulletinPage.src =
        "pages/" + pages[currentPageIndex];


    /*

       Page numbering:

       Index 0 = Page 01
       Index 1 = Page 02
       Index 2 = Page 03
       etc.

    */

    const pageNumber =
        currentPageIndex + 1;


    currentPage.textContent =
        String(pageNumber).padStart(2, "0");


    /* Total pages */

    totalPages.textContent =
        String(pages.length).padStart(2, "0");


    /* Disable buttons */

    previousButton.disabled =
        currentPageIndex === 0;


    nextButton.disabled =
        currentPageIndex === pages.length - 1;


    /* Update URL */

    const newUrl =
        window.location.pathname +
        "?page=" +
        pageNumber;


    window.history.replaceState(
        {},
        "",
        newUrl
    );

}


/* =========================================================
   NEXT PAGE
========================================================= */

function nextPage() {

    if (
        currentPageIndex <
        pages.length - 1
    ) {

        loadPage(
            currentPageIndex + 1
        );

    }

}


/* =========================================================
   PREVIOUS PAGE
========================================================= */

function previousPage() {

    if (currentPageIndex > 0) {

        loadPage(
            currentPageIndex - 1
        );

    }

}


/* =========================================================
   BUTTON EVENTS
========================================================= */

nextButton.addEventListener(
    "click",
    nextPage
);


previousButton.addEventListener(
    "click",
    previousPage
);


/* =========================================================
   KEYBOARD CONTROLS
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "ArrowRight") {

            nextPage();

        }


        if (event.key === "ArrowLeft") {

            previousPage();

        }

    }
);


/* =========================================================
   OPEN SPECIFIC PAGE FROM URL
========================================================= */

function getStartingPage() {

    const urlParams =
        new URLSearchParams(
            window.location.search
        );


    const page =
        parseInt(
            urlParams.get("page")
        );


    /*
       URL page 1 = array index 0
       URL page 2 = array index 1
       etc.
    */

    if (
        !isNaN(page) &&
        page >= 1 &&
        page <= pages.length
    ) {

        return page - 1;

    }


    return 0;

}


/* =========================================================
   START
========================================================= */

loadPage(
    getStartingPage()
);

</script>


</body>

</html>
